<!DOCTYPE html>
<html lang="vi">
<head>

<title>Đấu La: Vạn Kiếp — Giai đoạn 0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0a10;color:#d9d2c3;font:16px/1.5 Georgia,'Times New Roman',serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

.ok{color:#7fd69a}.err{color:#ff7b7b}
#msg{min-height:1.5em;padding:4px 2px 14px;word-break:break-word}
.t{display:flex;gap:8px;align-items:flex-start;border-top:1px solid #241c33;padding:6px 0;font-size:.9rem}
.b{flex:none;min-width:64px;text-align:center;border-radius:6px;padding:0 6px;font-weight:bold;font-size:.8rem;line-height:1.8}
.b.p{background:#17402a;color:#7fd69a}.b.f{background:#4a1a1a;color:#ff7b7b}
.d{color:#8a7fa0;font-size:.8rem;word-break:break-word}
</style>
</head>
<body>
<main>
<h1>Đấu La: Vạn Kiếp</h1>
<p class="sub">Giai đoạn 0 · Nền tảng dữ liệu</p>
<section><h2>Trạng thái save</h2><div id="status"></div><button id="bDisc" hidden>Xóa save hỏng</button></section>
<section><h2>Kiếp hiện tại</h2><div id="life"></div>
<input id="name" maxlength="24" placeholder="Tên nhân vật" value="Đường Tam">
<button id="bNew">Kiếp mới</button><button id="bEnd">Kết thúc kiếp</button><button id="bAbandon">Từ bỏ kiếp</button></section>
<section><h2>Lịch sử &amp; Di sản</h2><div id="hist"></div></section>
<section><h2>Sao lưu</h2><textarea id="io" placeholder="Bản xuất hiện ở đây / dán bản sao lưu để nhập"></textarea>
<button id="bExp">Xuất</button><button id="bDl">Tải file</button><button id="bImp">Nhập</button></section>
<section><h2>Kiểm thử tự động</h2>
<p class="note">Chạy trên bộ nhớ giả, không đụng save thật. Đây là test tự động, KHÔNG thay cho kiểm thử thực tế trên thiết bị.</p>
<button id="bTest">Chạy kiểm thử</button><div id="tests"></div></section>
<div id="msg" role="status"></div>
</main>
<script>
'use strict';
/* ===== Tiện ích ===== */
const APP_ID='dau-la-van-kiep',SAVE_VERSION=2,MIN_VERSION=1,REAL_KEY='dlvk.save',TEST_KEY='dlvk.test';
const clone=o=>JSON.parse(JSON.stringify(o));
const canon=v=>Array.isArray(v)?'['+v.map(canon).join(',')+']':(v&&typeof v==='object')?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}':JSON.stringify(v);
const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
const isNum=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0;
const isInt=v=>Number.isInteger(v)&&v>=0;
const isU32=v=>Number.isInteger(v)&&v>=0&&v<=4294967295;
const isStr=(v,max=60)=>typeof v==='string'&&v.trim().length>0&&v.length<=max;
const ID_RE=/^life-\d{4,}$/,idNum=id=>+id.slice(5);
function checksum(d){const s=canon(d);let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(16).padStart(8,'0')}
function memStore(){const m=new Map();return{failWrites:false,silent:false,failRemove:false,silentRemove:false,getItem:k=>m.has(k)?m.get(k):null,setItem(k,v){if(this.failWrites)throw new Error('QuotaExceeded (mock)');if(!this.silent)m.set(k,String(v))},removeItem(k){if(this.failRemove)throw new Error('removeItem lỗi (mock)');if(!this.silentRemove)m.delete(k)}}}

/* ===== RNG (Mulberry32) ===== */
const RNG=(()=>{function create(state){let a=state>>>0;const next=()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
return{next,int:(lo,hi)=>lo+Math.floor(next()*(hi-lo+1)),pick:arr=>arr[Math.floor(next()*arr.length)],state:()=>a}}return{create}})();

/* ===== GAME_DATA ===== */
const GAME_DATA={
martialSouls:[{id:'lam_ngan_thao',name:'Lam Ngân Thảo',grade:'Phổ thông',w:50},{id:'hao_thien_chuy',name:'Hạo Thiên Chùy',grade:'Khí võ hồn',w:20},{id:'thanh_long',name:'Thanh Long',grade:'Thú võ hồn',w:12},{id:'bach_ho',name:'Bạch Hổ',grade:'Thú võ hồn',w:12},{id:'ta_nguyet',name:'Tà Nguyệt',grade:'Khí võ hồn',w:6}],
ranks:[[1,'Hồn Sư'],[11,'Đại Hồn Sư'],[21,'Hồn Tôn'],[31,'Hồn Tông'],[41,'Hồn Vương'],[51,'Hồn Đế'],[61,'Hồn Thánh'],[71,'Hồn Đấu La'],[81,'Phong Hào Đấu La'],[91,'Thần cấp']],
deathCauses:['Tuổi già','Bệnh nặng','Tử chiến','Hồn lực phản phệ','Tai nạn']};
const soulById=id=>GAME_DATA.martialSouls.find(s=>s.id===id);
const rankOf=l=>GAME_DATA.ranks.filter(r=>l>=r[0]).pop()[1];
const gainOf=(level,age)=>Math.floor(level/10)+Math.floor(age/20);

/* ===== Validate (không bao giờ throw: dữ liệu xấu nào cũng trả về danh sách lỗi) ===== */
const okId=x=>typeof x==='string'&&ID_RE.test(x);
function validateState(s){try{const r=validateCore(s);return Array.isArray(r)?r:['Kết quả kiểm tra không hợp lệ']}catch(err){return['Lỗi nội bộ khi kiểm tra: '+(err&&err.message?err.message:String(err))]}}
function validateCore(s){
const e=[],add=m=>e.push(m);
if(!isObj(s))return['Save không phải object'];
for(const k of Object.keys(s))if(!['meta','currentLife','lifeHistory','legacy'].includes(k))add('Khóa lạ: '+k);
const m=s.meta;let lc=null;
if(!isObj(m))add('Thiếu meta');else{
if(m.version!==SAVE_VERSION)add('meta.version sai');
if(m.gameId!==APP_ID)add('meta.gameId sai');
for(const k of['createdAt','updatedAt'])if(!isNum(m[k]))add('meta.'+k+' không hợp lệ');
for(const k of['saveCount','lifeCounter'])if(!isInt(m[k]))add('meta.'+k+' không hợp lệ');
if(isInt(m.lifeCounter))lc=m.lifeCounter}
const H=s.lifeHistory,ids=new Set(),byId=new Map();let sumY=0,sumP=0,best=0;
if(!Array.isArray(H))add('lifeHistory phải là mảng');else for(let i=0;i<H.length;i++){
const h=H[i],p='lifeHistory['+i+']';
if(!isObj(h)){add(p+' không hợp lệ');continue}
if(!okId(h.id))add(p+'.id không hợp lệ');else{if(ids.has(h.id))add('ID trùng trong lifeHistory: '+h.id);else byId.set(h.id,h);ids.add(h.id);if(lc!==null&&idNum(h.id)>lc)add(p+'.id vượt lifeCounter')}
if(!isStr(h.name,24))add(p+'.name không hợp lệ');
if(!soulById(h.martialSoulId))add(p+'.martialSoulId không hợp lệ');
if(!isInt(h.level)||h.level<1||h.level>99)add(p+'.level không hợp lệ');
for(const k of['ageAtDeath','legacyGain'])if(!isInt(h[k]))add(p+'.'+k+' không hợp lệ');
if(!isNum(h.endedAt))add(p+'.endedAt không hợp lệ');
if(!isStr(h.cause,40))add(p+'.cause không hợp lệ');
if(isInt(h.ageAtDeath))sumY+=h.ageAtDeath;if(isInt(h.legacyGain))sumP+=h.legacyGain;if(isInt(h.level))best=Math.max(best,h.level)}
const c=s.currentLife;
if(c!==null){if(!isObj(c))add('currentLife không hợp lệ');else{
const idOk=okId(c.id);
if(!idOk)add('currentLife.id không hợp lệ');else if(lc!==null&&idNum(c.id)>lc)add('currentLife.id vượt lifeCounter');
if(!isStr(c.name,24))add('currentLife.name không hợp lệ');
if(!isU32(c.seed))add('currentLife.seed không hợp lệ');
if(!isU32(c.rngState))add('currentLife.rngState không hợp lệ');
if(!soulById(c.martialSoulId))add('currentLife.martialSoulId không hợp lệ');
if(!isInt(c.age))add('currentLife.age không hợp lệ');
if(!isInt(c.level)||c.level<1||c.level>99)add('currentLife.level không hợp lệ');
if(!isNum(c.soulPower))add('currentLife.soulPower không hợp lệ');
const inH=idOk&&byId.has(c.id);
if(c.status==='alive'){if(c.death!==null)add('Kiếp đang sống không được có death');if(idOk&&ids.has(c.id))add('Kiếp đang sống không được nằm trong lifeHistory')}
else if(c.status==='dead'){
const dObj=isObj(c.death);
if(!dObj||!isStr(c.death.cause,40)||!isNum(c.death.at))add('currentLife.death không hợp lệ');
if(!inH)add('Kiếp đã chết nhưng chưa có trong lifeHistory');
else{const h=byId.get(c.id),mm=f=>add('Kiếp đã chết lệch lifeHistory ('+f+')');
if(h.name!==c.name)mm('name');
if(h.martialSoulId!==c.martialSoulId)mm('martialSoulId');
if(h.ageAtDeath!==c.age)mm('ageAtDeath');
if(h.level!==c.level)mm('level');
if(dObj&&h.endedAt!==c.death.at)mm('endedAt');
if(dObj&&h.cause!==c.death.cause)mm('cause');
if(isInt(c.level)&&isInt(c.age)&&h.legacyGain!==gainOf(c.level,c.age))mm('legacyGain')}}
else add('currentLife.status chỉ nhận alive hoặc dead')}}
const g=s.legacy;
if(!isObj(g))add('Thiếu legacy');else{
for(const k of['totalLives','totalYears','bestLevel','points'])if(!isInt(g[k]))add('legacy.'+k+' không hợp lệ');
if(Array.isArray(H)){if(g.totalLives!==H.length)add('legacy.totalLives lệch lifeHistory');if(g.totalYears!==sumY)add('legacy.totalYears lệch lifeHistory');if(g.points!==sumP)add('legacy.points lệch lifeHistory');if(g.bestLevel!==best)add('legacy.bestLevel lệch lifeHistory')}}
return e}

/* ===== Migration (mỗi bước: version N -> N+1) ===== */
/* v1 (giả định định dạng Giai đoạn 0 cũ): meta chỉ có version/createdAt; legacy chưa có points; lifeHistory chưa có legacyGain (migrate tính bù legacyGain/points theo gainOf). */
const MIGRATIONS={1:d=>{const o=clone(d),m=isObj(o.meta)?o.meta:{},H=Array.isArray(o.lifeHistory)?o.lifeHistory:[];
H.forEach(h=>{if(isObj(h)&&h.legacyGain===undefined)h.legacyGain=isInt(h.level)&&isInt(h.ageAtDeath)?gainOf(h.level,h.ageAtDeath):0});
if(isObj(o.legacy)&&o.legacy.points===undefined)o.legacy.points=H.reduce((n,h)=>n+(isObj(h)&&isInt(h.legacyGain)?h.legacyGain:0),0);
if(isObj(o.currentLife)&&o.currentLife.death===undefined)o.currentLife.death=null;
const nums=[...H,o.currentLife].filter(x=>isObj(x)&&ID_RE.test(x.id)).map(x=>idNum(x.id));
o.meta={version:2,gameId:APP_ID,createdAt:m.createdAt,updatedAt:m.updatedAt!==undefined?m.updatedAt:m.createdAt,saveCount:m.saveCount!==undefined?m.saveCount:0,lifeCounter:Math.max(0,...nums)};
return o}};

/* ===== SAVE_MANAGER ===== */
function createSaveManager(storage,key){
const bad=(code,error)=>({ok:false,code,error});
const serialize=d=>JSON.stringify({app:APP_ID,version:SAVE_VERSION,checksum:checksum(d),data:d});
function parse(text){ /* kiểm tra đầy đủ, KHÔNG ghi gì */
let env;try{env=JSON.parse(text)}catch(_){return bad('BAD_JSON','Không phải JSON hợp lệ')}
if(!isObj(env)||env.app!==APP_ID||!isObj(env.data)||typeof env.checksum!=='string')return bad('BAD_FORMAT','Không phải file save của game này');
const v=env.version;
if(!Number.isInteger(v)||v<MIN_VERSION)return bad('VERSION_UNSUPPORTED','Version save không được hỗ trợ: '+v);
if(v>SAVE_VERSION)return bad('VERSION_TOO_NEW','Save từ bản game mới hơn (v'+v+'), bản này chỉ hỗ trợ tới v'+SAVE_VERSION);
if(!isObj(env.data.meta)||env.data.meta.version!==v)return bad('VERSION_MISMATCH','Version trong meta không khớp');
if(checksum(env.data)!==env.checksum)return bad('CHECKSUM_MISMATCH','Checksum sai, dữ liệu bị sửa hoặc hỏng');
let d=clone(env.data);
for(let x=v;x<SAVE_VERSION;x++){try{d=MIGRATIONS[x](d)}catch(err){return bad('MIGRATION_FAILED','Migrate lỗi: '+err.message)}}
const errs=validateState(d);
if(errs.length)return bad('INVALID_DATA','Dữ liệu không hợp lệ: '+errs.slice(0,3).join('; '));
return{ok:true,data:d,migratedFrom:v<SAVE_VERSION?v:null}}
function load(){let raw;try{raw=storage.getItem(key)}catch(err){return{status:'error',code:'READ_FAILED',error:'Không đọc được save: '+err.message}}
if(raw===null)return{status:'none'};const r=parse(raw);return r.ok?{status:'ok',data:r.data}:{status:'error',code:r.code,error:r.error}}
function write(data){const errs=validateState(data);if(errs.length)return bad('INVALID_STATE',errs[0]);
const text=serialize(data);let prev=null;
try{prev=storage.getItem(key);storage.setItem(key,text);if(storage.getItem(key)!==text)throw new Error('ghi xong nhưng đọc lại không khớp')}
catch(err){try{prev===null?storage.removeItem(key):storage.setItem(key,prev)}catch(_){}return bad('SAVE_FAILED','Không lưu được: '+err.message)}
return{ok:true}}
return{parse,load,write,serialize,raw:()=>storage.getItem(key),clear:()=>storage.removeItem(key)}}

/* ===== GAME_ENGINE ===== */
function createEngine(save,now=()=>Date.now()){
let state=null,blocked=null,persisted=false;
const fail=(code,error)=>({ok:false,code,error});
const guard=()=>blocked?fail('SAVE_BLOCKED','Save bị lỗi ('+blocked.error+'). Nhập bản sao lưu hoặc xóa save hỏng trước.'):null;
const defaultState=()=>{const t=now();return{meta:{version:SAVE_VERSION,gameId:APP_ID,createdAt:t,updatedAt:t,saveCount:0,lifeCounter:0},currentLife:null,lifeHistory:[],legacy:{totalLives:0,totalYears:0,bestLevel:0,points:0}}};
function init(){const r=save.load();
if(r.status==='ok'){state=r.data;persisted=true;blocked=null}
else if(r.status==='none'){state=defaultState();persisted=false;blocked=null}
else{state=null;persisted=false;blocked=r}
return status()}
const status=()=>({blocked:blocked?{code:blocked.code,error:blocked.error}:null,persisted});
/* Mọi thay đổi đi qua commit: sửa bản sao -> validate -> ghi -> chỉ khi ghi OK mới thay state */
function commit(next){next.meta.updatedAt=now();next.meta.saveCount++;const r=save.write(next);if(!r.ok)return r;state=next;persisted=true;return{ok:true}}
function newLife(a){const b=guard();if(b)return b;
if(!isStr(a.name,24))return fail('BAD_NAME','Tên nhân vật không hợp lệ (1–24 ký tự)');
if(state.currentLife&&state.currentLife.status==='alive')return fail('LIFE_STILL_ALIVE','Kiếp hiện tại vẫn còn sống. Hãy kết thúc hoặc từ bỏ (có xác nhận) trước.');
const next=clone(state);next.meta.lifeCounter++;
const id='life-'+String(next.meta.lifeCounter).padStart(4,'0');
const seed=(a.seed!==undefined?a.seed:(now()^Math.imul(next.meta.lifeCounter,2654435761)))>>>0;
const rng=RNG.create(seed),tot=GAME_DATA.martialSouls.reduce((s,x)=>s+x.w,0);let roll=rng.next()*tot,soul=GAME_DATA.martialSouls[0];
for(const s of GAME_DATA.martialSouls){if(roll<s.w){soul=s;break}roll-=s.w}
next.currentLife={id,name:a.name.trim(),status:'alive',seed,rngState:0,martialSoulId:soul.id,age:6,level:1,soulPower:rng.int(1,10),death:null};
next.currentLife.rngState=rng.state();
return commit(next)}
function endLife(cause){const b=guard();if(b)return b;const c=state.currentLife;
if(!c)return fail('NO_LIFE','Chưa có kiếp nào');
if(c.status==='dead')return fail('ALREADY_DEAD','Kiếp này đã kết thúc, không ghi lại lần nữa');
const next=clone(state),L=next.currentLife,rng=RNG.create(L.rngState);
L.age+=rng.int(5,70);L.level=Math.min(99,L.level+rng.int(0,60));
const why=(typeof cause==='string'&&cause.trim())?cause.trim().slice(0,40):rng.pick(GAME_DATA.deathCauses);
L.rngState=rng.state();L.status='dead';L.death={cause:why,at:now()};
const gain=gainOf(L.level,L.age);
next.lifeHistory.push({id:L.id,name:L.name,martialSoulId:L.martialSoulId,level:L.level,ageAtDeath:L.age,cause:why,endedAt:L.death.at,legacyGain:gain});
const g=next.legacy;g.totalLives++;g.totalYears+=L.age;g.bestLevel=Math.max(g.bestLevel,L.level);g.points+=gain;
return commit(next)}
function abandonLife(a){if(!a||a.confirmed!==true)return fail('CONFIRM_REQUIRED','Cần xác nhận để từ bỏ kiếp đang sống');return endLife('Từ bỏ kiếp sống')}
function exportText(){const b=guard();if(b)return b;const errs=validateState(state);if(errs.length)return fail('INVALID_STATE',errs[0]);return{ok:true,text:save.serialize(state)}}
function importText(text){const r=save.parse(text);if(!r.ok)return r; /* lỗi -> dừng, save cũ nguyên vẹn */
const w=save.write(r.data);if(!w.ok)return w;state=r.data;blocked=null;persisted=true;return{ok:true,migratedFrom:r.migratedFrom}}
function discardCorrupt(a){if(!a||a.confirmed!==true)return fail('CONFIRM_REQUIRED','Cần xác nhận để xóa save hỏng');if(!blocked)return fail('NOT_BLOCKED','Save không bị hỏng');try{save.clear();if(save.raw()!==null)throw new Error('khóa vẫn còn sau khi xóa')}catch(err){return fail('CLEAR_FAILED','Không xóa được save hỏng ('+err.message+'). Save hỏng vẫn còn nguyên.')}
init();return{ok:true}}
function dispatch(a){switch(a&&a.type){
case'NEW_LIFE':return newLife(a);case'END_LIFE':return endLife(a.cause);case'ABANDON_LIFE':return abandonLife(a);
case'EXPORT':return exportText();case'IMPORT':return importText(a.text);case'DISCARD_CORRUPT':return discardCorrupt(a);
default:return fail('UNKNOWN_ACTION','Action không hỗ trợ')}}
return{init,status,dispatch,getState:()=>state===null?null:clone(state)}}

/* ===== Instance thật ===== */
let _ls=null;try{_ls=localStorage}catch(_){}
const REAL_STORAGE=_ls||memStore();
const ENGINE=createEngine(createSaveManager(REAL_STORAGE,REAL_KEY));

/* ===== Kiểm thử tự động (chỉ dùng bộ nhớ giả + khóa test riêng) ===== */
const SELF_TEST=(()=>{
const A=(c,m)=>{if(!c)throw new Error(m||'assert thất bại')};
const mk=()=>{const st=memStore();const sm=createSaveManager(st,TEST_KEY);let t=1e12;const en=createEngine(sm,()=>t+=1000);en.init();return{st,sm,en}};
const raw=e=>e.st.getItem(TEST_KEY),S=e=>e.en.getState(),D=(e,a)=>e.en.dispatch(a);
const live=(e,seed=7)=>{const r=D(e,{type:'NEW_LIFE',name:'Đường Tam',seed});A(r.ok,r.error);return r};
const die=e=>{const r=D(e,{type:'END_LIFE'});A(r.ok,r.error);return r};
const env=(d,v)=>JSON.stringify({app:APP_ID,version:v,checksum:checksum(d),data:d});
const two=()=>{const a=mk();live(a);die(a);live(a,9);return a};
